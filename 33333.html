<html lang="ko"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소개</title>
    <!-- Google Fonts: Cute & Round Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&amp;family=Gowun+Dodum&amp;display=swap" rel="stylesheet">
    
    <style>
        /* === 기본 핑크 베이커리 테마 스타일 === */
        :root {
            --bg-color: #fff0f3;
            --main-pink: #ffb3c1;
            --dark-pink: #ff4d6d;
            --accent-red: #c9184a;
            --cream-white: #fff5f6;
            --text-color: #590d22;
            --card-shadow: 0 10px 25px rgba(255, 77, 109, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Gowun Dodum', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            background-image: 
                radial-gradient(#ffccd5 1.5px, transparent 1.5px), 
                radial-gradient(#ffccd5 1.5px, #fff0f3 1.5px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            padding: 20px 15px 60px 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* === 헤더 & 애니메이션 === */
        header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 30px;
            border: 3px solid var(--main-pink);
            box-shadow: var(--card-shadow);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        .decor-strawberry {
            font-size: 2rem;
            position: absolute;
            top: 10px;
        }
        .left-berry { left: 15px; transform: rotate(-15deg); }
        .right-berry { right: 15px; transform: rotate(15deg); }

        .subtitle {
            font-size: 1.1rem;
            color: var(--dark-pink);
            font-weight: bold;
            margin-bottom: 5px;
        }

        /* 통통 튀는 글자 애니메이션 */
        .bouncing-title {
            font-family: 'Gaegu', cursive;
            font-size: 3.5rem;
            color: var(--accent-red);
            display: flex;
            justify-content: center;
            gap: 4px;
            margin: 10px 0;
            user-select: none;
        }

        .bouncing-title span {
            display: inline-block;
            animation: bounce 1.2s infinite ease-in-out alternate;
            text-shadow: 2px 2px 0px #fff, 4px 4px 0px var(--main-pink);
        }

        .bouncing-title span:nth-child(1) { animation-delay: 0.0s; }
        .bouncing-title span:nth-child(2) { animation-delay: 0.2s; }
        .bouncing-title span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-18px) scale(1.1); }
        }

        .welcome-msg {
            font-size: 0.95rem;
            color: var(--text-color);
            margin-top: 10px;
            background: var(--cream-white);
            padding: 8px 15px;
            border-radius: 20px;
            display: inline-block;
            border: 1px dashed var(--dark-pink);
        }

        /* === 공통 섹션 카드 === */
        section {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 25px;
            padding: 22px 18px;
            margin-bottom: 25px;
            border: 2px solid #ffccd5;
            box-shadow: var(--card-shadow);
        }

        section h2 {
            font-family: 'Gaegu', cursive;
            font-size: 1.8rem;
            color: var(--dark-pink);
            margin-bottom: 15px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* === 1. 방문자 환영 입력 === */
        .guest-box {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
        }

        .guest-input-group {
            display: flex;
            width: 100%;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--main-pink);
            border-radius: 18px;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: #fff;
        }

        input[type="text"]:focus {
            border-color: var(--dark-pink);
            box-shadow: 0 0 8px rgba(255, 77, 109, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, var(--main-pink), var(--dark-pink));
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 18px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            box-shadow: 0 4px 10px rgba(255, 77, 109, 0.3);
            transition: transform 0.1s, background 0.2s;
            white-space: nowrap;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .greeting-display {
            width: 100%;
            text-align: center;
            padding: 12px;
            background: var(--cream-white);
            border-radius: 15px;
            font-weight: bold;
            color: var(--accent-red);
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        /* === 2. 좋아하는 것 3가지 (카드 뒤집기) === */
        .cards-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card-tip {
            text-align: center;
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 5px;
        }

        .flip-card {
            background-color: transparent;
            height: 120px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
            border: 2px solid var(--main-pink);
        }

        .flip-card-front {
            background: linear-gradient(135deg, #ffffff, #fff0f3);
            justify-content: flex-start;
            gap: 15px;
        }

        .card-icon {
            font-size: 2.8rem;
            background: var(--cream-white);
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px solid var(--main-pink);
            flex-shrink: 0;
        }

        .card-title {
            text-align: left;
        }

        .card-title h3 {
            font-size: 1.3rem;
            color: var(--accent-red);
            font-family: 'Gaegu', cursive;
        }

        .card-title p {
            font-size: 0.85rem;
            color: #777;
            margin-top: 2px;
        }

        .flip-card-back {
            background: linear-gradient(135deg, #ffccd5, #ffb3c1);
            color: var(--text-color);
            transform: rotateY(180deg);
            justify-content: center;
            flex-direction: column;
            text-align: center;
        }

        .flip-card-back h4 {
            font-size: 1.05rem;
            margin-bottom: 5px;
            color: var(--accent-red);
        }

        .flip-card-back p {
            font-size: 0.9rem;
            line-height: 1.3;
            word-break: keep-all;
        }

        /* === 3. OX 퀴즈 === */
        .quiz-box {
            text-align: center;
        }

        .quiz-question {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 15px;
            background: var(--cream-white);
            padding: 12px;
            border-radius: 15px;
            border: 1px dashed var(--dark-pink);
        }

        .ox-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .ox-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            font-size: 2.2rem;
            font-weight: bold;
            border: 3px solid var(--dark-pink);
            background: white;
            color: var(--dark-pink);
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.2);
            transition: all 0.2s;
        }

        .ox-btn:hover, .ox-btn:active {
            background: var(--dark-pink);
            color: white;
            transform: scale(1.08);
        }

        .quiz-result {
            min-height: 48px;
            padding: 10px;
            border-radius: 15px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .quiz-result.correct {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 2px solid #a5d6a7;
            animation: popIn 0.3s ease;
        }

        .quiz-result.wrong {
            background-color: #ffebee;
            color: #c62828;
            border: 2px solid #ef9a9a;
            animation: shake 0.4s ease;
        }

        /* === 4. 오늘의 운세 === */
        .fortune-box {
            text-align: center;
        }

        .fortune-display {
            margin-top: 15px;
            padding: 18px;
            background: var(--cream-white);
            border-radius: 20px;
            border: 2px dashed var(--main-pink);
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            line-height: 1.4;
            color: var(--accent-red);
            font-weight: bold;
            word-break: keep-all;
        }

        /* === 푸터 === */
        footer {
            text-align: center;
            font-size: 0.85rem;
            color: var(--dark-pink);
            margin-top: 20px;
            opacity: 0.8;
        }

        /* === 키프레임 애니메이션 === */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }

        /* 팡파레/눈가루 파티클 효과용 고정 레이어 */
        #particle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 9999;
        }

        .particle {
            position: absolute;
            font-size: 1.5rem;
            animation: fall 2.5s linear forwards;
        }

        @keyframes fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>

</div>

<script data-studio="js">
(function () {
    function each(sel, fn) { Array.prototype.forEach.call(document.querySelectorAll(sel), fn); }
    each('[data-st="tabs"]', function (t) {
      var bs = t.querySelectorAll('.st-tab'), ps = t.querySelectorAll('.st-tab-panel');
      function show(i) { bs.forEach(function (b, k) { b.classList.toggle('is-on', k === i); b.setAttribute('aria-selected', k === i); }); ps.forEach(function (p, k) { p.hidden = k !== i; }); }
      bs.forEach(function (b, i) { b.addEventListener('click', function () { show(i); }); });
      show(0);
    });
    each('[data-st-open]', function (b) { b.addEventListener('click', function () { var d = document.getElementById(b.getAttribute('data-st-open')); if (d && d.showModal) d.showModal(); }); });
    each('dialog.st-modal', function (d) { d.addEventListener('click', function (e) { if (e.target === d || e.target.closest('[data-st-close]')) d.close(); }); });
    each('[data-st="slider"]', function (s) {
      var tr = s.querySelector('.st-slides'), dots = s.querySelector('.st-dots'), i = 0, n = tr.children.length;
      function paint() { if (dots) Array.prototype.forEach.call(dots.children, function (d, k) { d.classList.toggle('is-on', k === i); }); }
      function go(k) { i = (k + n) % n; tr.scrollTo({ left: tr.clientWidth * i, behavior: 'smooth' }); paint(); }
      if (dots) { dots.innerHTML = ''; for (var k = 0; k < n; k++) (function (k) { var d = document.createElement('button'); d.type = 'button'; d.setAttribute('aria-label', (k + 1) + '번째 사진'); d.addEventListener('click', function () { go(k); }); dots.appendChild(d); })(k); }
      var pv = s.querySelector('.st-prev'), nx = s.querySelector('.st-next');
      if (pv) pv.addEventListener('click', function () { go(i - 1); });
      if (nx) nx.addEventListener('click', function () { go(i + 1); });
      tr.addEventListener('scroll', function () { var k = Math.round(tr.scrollLeft / (tr.clientWidth || 1)); if (k !== i) { i = k; paint(); } });
      paint();
    });
    each('[data-st="quiz"]', function (q) {
      var r = q.querySelector('.st-qr'), os = q.querySelectorAll('.st-opt');
      os.forEach(function (o) { o.addEventListener('click', function () { var ok = o.hasAttribute('data-ok'); os.forEach(function (x) { x.classList.remove('is-ok', 'is-no'); }); o.classList.add(ok ? 'is-ok' : 'is-no'); if (r) r.textContent = ok ? (q.getAttribute('data-ok-msg') || '정답이에요!') : (q.getAttribute('data-no-msg') || '다시 생각해 봐요.'); }); });
    });
    each('[data-st="check"]', function (c, ci) {
      var bs = c.querySelectorAll('input[type=checkbox]'), out = c.querySelector('.st-cnt'), bar = c.querySelector('.st-bar i'), key = 'st-check-' + location.pathname + '-' + ci, sv = {};
      try { sv = JSON.parse(localStorage.getItem(key) || '{}') || {}; } catch (e) {}
      function up() { var d = 0; bs.forEach(function (b) { if (b.checked) d++; }); if (out) out.textContent = d + ' / ' + bs.length + ' 완료'; if (bar) bar.style.width = (bs.length ? d / bs.length * 100 : 0) + '%'; }
      bs.forEach(function (b, i) { b.checked = !!sv[i]; b.addEventListener('change', function () { sv[i] = b.checked; try { localStorage.setItem(key, JSON.stringify(sv)); } catch (e) {} up(); }); });
      up();
    });
    each('[data-st="dday"]', function (e) {
      var o = e.querySelector('.st-dnum'), t = new Date(e.getAttribute('data-date') + 'T00:00:00'), now = new Date(); now.setHours(0, 0, 0, 0);
      var d = Math.round((t - now) / 864e5); if (o) o.textContent = isNaN(d) ? '날짜를 정해요' : d > 0 ? 'D-' + d : d === 0 ? 'D-DAY' : 'D+' + (-d);
    });
    each('[data-st="timer"]', function (e) {
      var m = +e.getAttribute('data-min') || 25, left = m * 60, id = 0, o = e.querySelector('.st-tnum'), go = e.querySelector('.st-tgo'), rs = e.querySelector('.st-trs');
      function p() { o.textContent = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(left % 60).padStart(2, '0'); }
      function stop() { clearInterval(id); id = 0; go.textContent = '시작'; }
      go.addEventListener('click', function () { if (id) { stop(); return; } o.classList.remove('is-done'); id = setInterval(function () { if (left > 0) { left--; p(); } if (left <= 0) { stop(); o.classList.add('is-done'); } }, 1000); go.textContent = '잠시 멈춤'; });
      rs.addEventListener('click', function () { stop(); left = m * 60; o.classList.remove('is-done'); p(); });
      p();
    });
    each('[data-st="dark"]', function (b) {
      try { if (localStorage.getItem('st-dark') === '1') document.documentElement.classList.add('st-dark'); } catch (e) {}
      b.addEventListener('click', function () { var on = document.documentElement.classList.toggle('st-dark'); try { localStorage.setItem('st-dark', on ? '1' : '0'); } catch (e) {} });
    });
    // 스크롤 등장 효과: 화면에 들어오면 나타남 (지원하지 않는 브라우저·움직임 줄이기 설정에서는 그냥 보임)
    var ins = document.querySelectorAll('[data-st-in]');
    if (ins.length && 'IntersectionObserver' in window && !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) {
      document.documentElement.classList.add('st-js');
      var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } }); }, { threshold: 0.08 });
      Array.prototype.forEach.call(ins, function (e) { io.observe(e); });
    }
  })();
</script>
